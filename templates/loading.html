<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Farmly — Loading</title>
<noscript><meta http-equiv="refresh" content="4;url={% url 'home' %}"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#4F6F52; --sage-dark:#3C5940; --sage-tint:#E7ECE4;
    --farm-green:#6E9B4F; --farm-green-tint:#E7EEDD;
    --mustard:#C99B44; --terracotta:#BC7B4C; --clay:#A65D3F;
    --brown:#5E4635; --soil:#3A2C22;
    --cream:#F6F2EA; --paper:#FFFDF9; --ink:#362C22; --ink-soft:#75695C; --line:#E6DFD2;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    overflow:hidden; text-align:center;
  }
  .brand{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:clamp(32px,8vw,48px); color:var(--sage-dark); letter-spacing:-.01em; line-height:1}
  .brand span{color:var(--mustard)}
  .tag{margin:8px 0 18px; font-size:14px; color:var(--ink-soft)}

  .scene{position:relative; width:min(100%,640px); height:260px; overflow:hidden; border-radius:20px; background:var(--paper); border:1px solid var(--line)}
  .sun{position:absolute; top:22px; right:12%; width:46px; height:46px; border-radius:50%; background:var(--mustard); box-shadow:0 0 0 10px #C99B4426}
  .cloud{position:absolute; height:14px; width:58px; border-radius:20px; background:var(--sage-tint); animation:drift 20s linear infinite}
  .cloud::before{content:""; position:absolute; left:10px; top:-9px; width:26px; height:20px; border-radius:50%; background:inherit}
  .c1{top:36px; left:-80px}
  .c2{top:74px; left:-80px; animation-duration:28s; animation-delay:-11s; transform:scale(.75)}
  @keyframes drift{to{transform:translateX(780px)}}

  .hills{position:absolute; left:0; width:200%; animation:scroll 14s linear infinite}
  .hills.back{bottom:60px; height:80px}
  .hills.front{bottom:56px; height:54px; animation-duration:8s}
  @keyframes scroll{to{transform:translateX(-50%)}}

  .road{position:absolute; bottom:0; left:0; right:0; height:62px; background:var(--brown)}
  .dashes{position:absolute; bottom:28px; left:0; width:200%; height:5px; background:repeating-linear-gradient(90deg,var(--cream) 0 38px,transparent 38px 84px); animation:scroll 1.1s linear infinite}

  .truck{position:absolute; bottom:44px; left:50%; width:280px; margin-left:-140px; animation:bounce .5s ease-in-out infinite}
  @keyframes bounce{50%{transform:translateY(-3px)}}
  .wheel{transform-box:fill-box; transform-origin:center; animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fruit{transform-box:fill-box; transform-origin:center bottom; animation:jig .5s ease-in-out infinite}
  .fruit:nth-child(odd){animation-delay:-.25s}
  @keyframes jig{50%{transform:translateY(-2px) rotate(4deg)}}

  .bar{width:min(78vw,320px); height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:26px}
  .bar i{display:block; height:100%; width:0; border-radius:99px; background:var(--sage); animation:load 3.5s ease-in-out forwards}
  @keyframes load{0%{width:4%} 100%{width:100%}}
  .msg{margin-top:14px; font-size:15px; font-weight:600; color:var(--sage-dark)}
  .msg::after{content:""; animation:dots 1.4s steps(4) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .skip{margin-top:12px; font-size:13px; color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--line)}
  .skip:hover{color:var(--sage-dark)}

  @media (prefers-reduced-motion:reduce){
    .cloud,.hills,.dashes,.truck,.wheel,.fruit{animation:none}
    .bar i{animation-duration:3.5s}
  }
</style>
</head>
<body>
  <div class="brand">Farm<span>ly</span></div>
  <p class="tag">From Farm to Family, Fairly.</p>

  <div class="scene" role="img" aria-label="A truck loaded with fresh fruit driving along a country road">
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <svg class="hills back" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path fill="#DCE6D0" d="M0 80V44Q90 0 180 40T360 36T540 44T720 40Q810 0 900 40T1080 36T1260 44T1440 40V80Z"/></svg>
    <svg class="hills front" viewBox="0 0 1440 54" preserveAspectRatio="none" aria-hidden="true"><path fill="#B7CDA0" d="M0 54V28Q60 4 120 26T240 28T360 22T480 28T600 26T720 28Q780 4 840 26T960 28T1080 22T1200 28T1320 26T1440 28V54Z"/></svg>
    <div class="road"></div><div class="dashes"></div>

    <svg class="truck" viewBox="0 0 320 160" aria-hidden="true">
      <g>
        <g class="fruit"><circle cx="40" cy="52" r="17" fill="#C2453B"/><path d="M40 36q2-9 9-10" stroke="#5E4635" stroke-width="3" fill="none"/><ellipse cx="34" cy="46" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
        <g class="fruit"><circle cx="78" cy="48" r="18" fill="#D98A2B"/><circle cx="78" cy="30" r="3" fill="#4F6F52"/><ellipse cx="72" cy="42" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
        <g class="fruit"><ellipse cx="118" cy="52" rx="20" ry="15" fill="#D9A017"/><ellipse cx="111" cy="47" rx="4" ry="5" fill="#fff" opacity=".4"/></g>
        <g class="fruit"><circle cx="154" cy="50" r="17" fill="#6E9B4F"/><path d="M154 34q2-8 9-9" stroke="#5E4635" stroke-width="3" fill="none"/><ellipse cx="148" cy="44" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
        <g class="fruit"><circle cx="60" cy="66" r="13" fill="#D98A2B"/><circle cx="98" cy="68" r="14" fill="#C2453B"/><circle cx="138" cy="68" r="13" fill="#7A4A8C"/><circle cx="174" cy="66" r="12" fill="#7A4A8C"/></g>
      </g>
      <rect x="14" y="72" width="184" height="46" rx="5" fill="#BC7B4C"/>
      <path d="M14 88h184M14 104h184M60 72v46M106 72v46M152 72v46" stroke="#A65D3F" stroke-width="3"/>
      <path d="M204 118V70q0-6 6-6h34q8 0 14 8l22 24q4 5 4 12v10z" fill="#4F6F52"/>
      <path d="M222 72h20q5 0 9 5l14 16h-43z" fill="#E7ECE4"/>
      <rect x="200" y="112" width="106" height="12" rx="4" fill="#3C5940"/>
      <rect x="296" y="98" width="10" height="8" rx="2" fill="#C99B44"/>
      <g class="wheel"><circle cx="66" cy="124" r="20" fill="#3A2C22"/><circle cx="66" cy="124" r="9" fill="#E6DFD2"/><path d="M66 115v18M57 124h18" stroke="#75695C" stroke-width="3"/></g>
      <g class="wheel"><circle cx="240" cy="124" r="20" fill="#3A2C22"/><circle cx="240" cy="124" r="9" fill="#E6DFD2"/><path d="M240 115v18M231 124h18" stroke="#75695C" stroke-width="3"/></g>
    </svg>
  </div>

  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="msg" role="status">Delivering fresh produce</div>
  <a class="skip" href="{% url 'home' %}">Skip</a>

  <script>
    // Hand off to the landing page once the loading animation has finished.
    setTimeout(function () { window.location.replace("{% url 'home' %}"); }, 3600);
  </script>
</body>
</html>
